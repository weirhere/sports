name: Web CI

# Deliberately unfiltered, for the same reason as ci.yml: a required
# check that path-filters itself out of a PR never reports, and an
# unreported required check blocks the merge permanently.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          # The parity check diffs against the PR's base, so it needs the
          # history either side of it, not just the tip.
          fetch-depth: 0
      # First, and outside `web/`: the coupling between the iOS app and this
      # one. Every PR with a decision writes docs/changes/<pr>.md, and the
      # web-parity status is a required section of that file. This validates
      # the change files and fails a branch that grows either frozen ledger.
      # It rides this job rather than standing as its own check so it blocks
      # a merge with no branch-protection change.
      - name: Change files and parity
        working-directory: .
        run: |
          ./scripts/check-parity-ledger.sh \
            "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      # The readable tables are built, not committed: the frozen history plus
      # one row per change file. Uploaded so a reviewer can read the whole
      # log without assembling it.
      - name: Assemble the decisions log and parity ledger
        working-directory: .
        run: python3 scripts/build-changelog.py build | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: docs/generated/
          retention-days: 14
      # Informational, and the reason the ledger is worth keeping: parity you
      # can read a number off is parity you can notice drifting. Never fails
      # the build — the check above is the one with teeth.
      - name: Web parity status
        working-directory: .
        run: ./scripts/parity-status.sh docs/generated/web-parity.md | tee -a "$GITHUB_STEP_SUMMARY"
      # v4 declared node20 and every run carried a deprecation warning for
      # it; everything from v5 up declares node24, which is what the runner
      # had been forcing these actions onto anyway. Tracking latest rather
      # than the minimum that clears the warning, so this doesn't recur.
      #
      # The breaking change worth knowing: from v5 this caches automatically
      # when `package.json` names a package manager. `web/package.json`
      # doesn't, so the explicit `cache: npm` below stays the only caching —
      # verified against a real run (one cache hit, one restore).
      #
      # `node-version` is unrelated to all of that: it is the Node the build
      # runs on, not the Node the action runs on.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
