<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="social.css">
<script>if (location.search.indexOf("69") >= 0) document.documentElement.classList.add("as69");</script>
<style>
  .stage::before {
    background:
      radial-gradient(100% 50% at 50% 80%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.035) 36%, rgba(0,0,0,0) 70%),
      radial-gradient(80% 30% at 50% 8%, rgba(255,255,255,0.055) 0%, rgba(0,0,0,0) 62%);
  }
  .stage::after {
    -webkit-mask-image: radial-gradient(72% 40% at 50% 70%, #000 0%, rgba(0,0,0,0) 80%);
    mask-image: radial-gradient(72% 40% at 50% 70%, #000 0%, rgba(0,0,0,0) 80%);
  }
  .headline { font-size: 70px; }

  /* Same stack as the 16:9 card: the strip, then the slate it controls. */
  .crop.strip {
    width: 920px; height: 84px;
    left: 80px; top: 760px;
    border-radius: 18px;
  }
  .crop.strip img { width: 920px; left: 0; top: -265px; }

  .crop.slate {
    width: 920px; height: 1020px;
    left: 80px; top: 900px;
  }
  .crop.slate img { width: 920px; left: 0; top: -352px; }
</style>
<style>
  /* App Store 1284x2778 reflow. */
  .stage { height: 2337px; zoom: 1.18889; }
  .stage9 .head { top: 400px; }
  .crop.strip { width: 1000px; height: 91px; left: 40px; top: 920px; }
  .crop.strip img { width: 1000px; left: 0; top: -288px; }
  .crop.slate { width: 1000px; height: 1300px; left: 40px; top: 1070px; }
  .crop.slate img { width: 1000px; left: 0; top: -383px; }
</style>
</head>
<body>
<div class="stage stage9">
  <div class="content">
    <div class="head">
      <div class="brand">
        <img src="../../../sports/Assets.xcassets/AppIcon.appiconset/AppIcon.png">
        <div class="wordmark">StatSide</div>
      </div>
      <div class="kicker">A week, not a date</div>
      <div class="headline">College football<br>thinks in weeks.</div>
      <div class="sub">Flip from Week 0 to championship week, the bowls, and the Playoff.</div>
    </div>

    <div class="crop strip"><img src="../../appstore/screenshots/01-scores.png"></div>
    <div class="crop slate"><img src="../../appstore/screenshots/01-scores.png"></div>
  </div>
</div>
</body>
</html>
