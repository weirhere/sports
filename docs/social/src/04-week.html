<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="social.css">
<style>
  .stage::before {
    background:
      radial-gradient(90% 80% at 50% 88%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.035) 36%, rgba(0,0,0,0) 70%),
      radial-gradient(70% 60% at 50% 0%, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 62%);
  }
  .stage::after {
    -webkit-mask-image: radial-gradient(60% 66% at 50% 72%, #000 0%, rgba(0,0,0,0) 82%);
    mask-image: radial-gradient(60% 66% at 50% 72%, #000 0%, rgba(0,0,0,0) 82%);
  }

  .head {
    position: absolute;
    top: 132px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .headline { font-size: 60px; margin-top: 18px; }
  .sub { font-size: 21px; margin-top: 18px; max-width: 780px; }

  /* The week strip, then the slate it controls — stacked the way the app stacks them. */
  .crop.strip {
    width: 1180px; height: 111px;
    left: 210px; top: 432px;
    border-radius: 20px;
  }
  .crop.strip img { width: 1180px; left: 0; top: -265px; }

  .crop.slate {
    width: 1180px; height: 320px;
    left: 210px; top: 580px;
  }
  .crop.slate img { width: 1180px; left: 0; top: -420px; }
</style>
</head>
<body>
<div class="stage stage16">
  <div class="content">

    <div class="brandmini">
      <img src="../../../sports/Assets.xcassets/AppIcon.appiconset/AppIcon.png">
      <div class="wordmark">StatSide</div>
    </div>

    <div class="head">
      <div class="kicker">A week, not a date</div>
      <div class="headline">College football thinks in weeks.</div>
      <div class="sub">Flip from Week 0 to championship week, the bowls, and the Playoff. Sunday keeps the completed week on screen until the new polls drop.</div>
    </div>

    <div class="crop strip">
      <img src="../../appstore/screenshots/01-scores.png">
    </div>
    <div class="crop slate">
      <img src="../../appstore/screenshots/01-scores.png">
    </div>

  </div>
</div>
</body>
</html>
