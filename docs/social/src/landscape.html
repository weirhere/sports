<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="social.css">
<style>
  .stage { width: 1600px; height: 900px; }
  .stage::before {
    background:
      radial-gradient(90% 90% at 74% 82%, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.04) 34%, rgba(0,0,0,0) 68%),
      radial-gradient(80% 70% at 20% 0%, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 62%);
  }
  .stage::after {
    -webkit-mask-image: radial-gradient(60% 80% at 74% 70%, #000 0%, rgba(0,0,0,0) 80%);
    mask-image: radial-gradient(60% 80% at 74% 70%, #000 0%, rgba(0,0,0,0) 80%);
  }

  .head {
    position: absolute;
    left: 96px;
    top: 50%;
    transform: translateY(-52%);
    width: 720px;
  }
  .brand img { width: 42px; height: 42px; }
  .wordmark { font-size: 31px; }

  .headline { font-size: 72px; margin-top: 36px; }
  .sub { font-size: 23px; margin-top: 22px; max-width: 660px; text-wrap: balance; }
  .pill { font-size: 14px; padding: 11px 20px; margin-top: 32px; }

  .phone.hero  { font-size: 330px; left: 990px; top: 286px; z-index: 3; }
  .phone.left  { font-size: 286px; left: 776px; top: 352px; z-index: 2;
                 transform: rotate(-7deg); }
  .phone.right { font-size: 286px; left: 1248px; top: 352px; z-index: 2;
                 transform: rotate(7deg); }
</style>
</head>
<body>
<div class="stage">
  <div class="content">

    <div class="head">
      <div class="brand">
        <img src="../../../sports/Assets.xcassets/AppIcon.appiconset/AppIcon.png">
        <div class="wordmark">StatSide</div>
      </div>

      <div class="headline">College football,<br>at a glance.</div>
      <div class="sub">Scores, rankings, and every conference — in one thumb, one scroll.</div>
      <div class="pill"><span class="dot"></span> Live scores · No ads · No account</div>
    </div>

    <div class="phone left">
      <img src="../../appstore/screenshots/04-rankings.png">
      <div class="glare"></div>
    </div>
    <div class="phone right">
      <img src="../../appstore/screenshots/03-game-detail.png">
      <div class="glare"></div>
    </div>
    <div class="phone hero">
      <img src="../../appstore/screenshots/01-scores.png">
      <div class="glare"></div>
    </div>

  </div>
</div>
</body>
</html>
