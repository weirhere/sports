<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="social.css">
<script>if (location.search.indexOf("69") >= 0) document.documentElement.classList.add("as69");</script>
<style>
  .stage::before {
    background:
      radial-gradient(100% 52% at 50% 74%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.035) 36%, rgba(0,0,0,0) 70%),
      radial-gradient(80% 30% at 50% 8%, rgba(255,255,255,0.055) 0%, rgba(0,0,0,0) 62%);
  }
  .stage::after {
    -webkit-mask-image: radial-gradient(72% 40% at 50% 66%, #000 0%, rgba(0,0,0,0) 80%);
    mask-image: radial-gradient(72% 40% at 50% 66%, #000 0%, rgba(0,0,0,0) 80%);
  }

  /* The team-page hero: back, bell, Following, share, then the identity
     block and the tab row — source y 170-1170. Full width, because the
     Following pill lives out on the toolbar's trailing edge now. */
  .crop.follow {
    width: 560px; height: 424px;
    left: 260px; top: 806px;
    transform: rotate(-2.5deg);
    z-index: 2;
  }
  .crop.follow img { width: 560px; left: 0; top: -72px; }

  /* Scores' Following card, source y 500-1460. */
  .crop.section {
    width: 880px; height: 640px;
    left: 100px; top: 1218px;
    z-index: 3;
  }
  .crop.section img { width: 880px; left: 0; top: -333px; }
</style>
<style>
  /* App Store 1284x2778 reflow. */
  .stage { height: 2337px; zoom: 1.18889; }
  .stage9 .head { top: 430px; }
  .crop.follow { width: 640px; height: 485px; left: 220px; top: 990px; }
  .crop.follow img { width: 640px; left: 0; top: -82px; }
  .crop.section { width: 980px; height: 792px; left: 50px; top: 1545px; }
  .crop.section img { width: 980px; left: 0; top: -371px; }
</style>
</head>
<body>
<div class="stage stage9">
  <div class="content">
    <div class="head">
      <div class="brand">
        <img src="../../../sports/Assets.xcassets/AppIcon.appiconset/AppIcon.png">
        <div class="wordmark">StatSide</div>
      </div>
      <div class="kicker">Following</div>
      <div class="headline">Your teams<br>lead the page.</div>
      <div class="sub">Follow any FBS team and their games sit at the top, every week — before you scroll anything else.</div>
    </div>

    <div class="crop follow"><img src="../../appstore/screenshots/06-team-page.png"></div>
    <div class="crop section"><img src="../../appstore/screenshots/01-scores.png"></div>
  </div>
</div>
</body>
</html>
